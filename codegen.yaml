schema:
  - https://graphql.pokeapi.co/v1beta2:
      headers: {}
overwrite: true

hooks:
  afterAllFileWrite:
    - prettier --write
generates:
  src/graphql/generated/schemas.tsx:
    documents: 'src/graphql/**/**.graphql'
    plugins:
      - typescript
      - typescript-operations
      - typescript-react-apollo
    config:
      withHOC: false
      withComponent: false
      withHooks: true
